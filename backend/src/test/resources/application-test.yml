spring:
  datasource:
    url: jdbc:h2:mem:homigo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

jwt:
  secret: test-only-secret-key-that-is-at-least-32-bytes-long
  expiration: 3600000
