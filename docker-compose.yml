version: '3.8'

services:
  db:
    image: mysql:8
    container_name: homigo_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: batdongsan
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: homigo_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=batdongsan
      - DB_USER=root
      - DB_PASSWORD=root
      - JWT_SECRET=VerySecretKeyForJwtAuthenticationInHomiGO
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: homigo_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
