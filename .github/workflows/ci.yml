name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test backend (H2 and real MySQL migrations)
        working-directory: backend
        run: ./mvnw --batch-mode verify
      - name: Annotate backend test failures
        if: failure()
        working-directory: backend
        shell: bash
        run: |
          shopt -s nullglob
          found_failure=false
          for report in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            if grep -Eq 'Failures: [1-9]|Errors: [1-9]' "$report"; then
              found_failure=true
              test_class=$(basename "$report" .txt)
              message=$(grep -E -m1 'Tests run:' "$report")
              message=${message//'%'/'%25'}
              message=${message//$'\r'/'%0D'}
              message=${message//$'\n'/'%0A'}
              echo "::error file=$report,title=Backend test failure::$test_class: $message"
            fi
          done
          if [ "$found_failure" = false ]; then
            echo "::error title=Backend verify failed::Maven failed without a failing Surefire or Failsafe report."
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests and coverage gates
        working-directory: frontend
        run: npm run test:coverage
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag homigo-backend:ci backend
      - name: Build frontend image
        run: docker build --tag homigo-frontend:ci frontend
